name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/updates.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    env:
      SITE_BASE_PATH: /opendoc/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build and pre-render
        run: npm run build
      - name: Validate and include the latest stable update feed
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release
          tag=$(gh release list --repo Ffinnis/opendoc --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            python3 Scripts/validate-release.py --feed Updates/appcast.xml
            cp Updates/appcast.xml website/dist/appcast.xml
          else
            tag=$(gh api repos/Ffinnis/opendoc/releases/latest --jq .tag_name)
            gh release download "$tag" --repo Ffinnis/opendoc --pattern appcast.xml --pattern 'OpenDoc-*.zip' --dir build/release
            python3 Scripts/validate-release.py build/release "$tag"
            cp build/release/appcast.xml website/dist/appcast.xml
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
