name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run Mac unit tests
        run: >-
          xcodebuild -project opendoc.xcodeproj -scheme opendoc
          -destination 'platform=macOS' -derivedDataPath build/mac
          DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
          -parallel-testing-enabled NO -only-testing:opendocTests test
      - name: Check offline CLI help
        run: |
          build/mac/Build/Products/Debug/opendoc.app/Contents/MacOS/opendoc --cli help
          build/mac/Build/Products/Debug/opendoc.app/Contents/MacOS/opendoc --cli help --json > build/help.json
          python3 -m json.tool build/help.json > /dev/null
      - name: Validate update signatures
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'
